<! Doctype html >

<html>
    <head>
        <style>
           body {
               background-color: cyan;
               font-family: Sans-Serif;
           } 
        </style>
    </head>
    <header>
        <title>Multiply two numbers</title>
    </header>
    <body>
       <div>
           <h1>Multiply two numbers</h1>
           <p>This program multiplies two numbers.</p>
       </div>
       
       <div>
           
           <button type="button" onclick="multiply()">Press Here</button>
       </div>
        
    </body>
    <script>
      

// multiplying two numbers

function multiply() {
	let num1 = 5;
	let num2 = 6;
	
	let num3;
	
	num3 = num1 * num2;
	
	window.alert("The product is : " + num3);
}
        
    </script>
    
    
</html>
